persistence:
  data:
    storageClass: nfs-client
    size: 2Gi
    type: persistentVolumeClaim
    accessMode: ReadWriteMany
    enabled: true
service:
  main:
    primary: true
    type: ClusterIP
    ports:
      http:
        primary: true
        port: 1880
        enabled: true
    controller: main
controllers:
  main:
    strategy: Recreate
    replicas: 1
    type: deployment
    revisionHistoryLimit: 3
    containers:
      main:
        strategy:
          type: Recreate
        env:
          NODE_RED_ENABLE_SAFE_MODE: 
          NODE_OPTIONS: 
          FLOWS: flows.json
          NODE_RED_ENABLE_PROJECTS: 
          TZ: America/New_York
        probes:
          readiness:
            spec:
              initialDelaySeconds: 0
              failureThreshold: 3
              timeoutSeconds: 1
              periodSeconds: 10
            custom: false
            type: TCP
            enabled: true
          liveness:
            spec:
              initialDelaySeconds: 0
              failureThreshold: 3
              timeoutSeconds: 1
              periodSeconds: 10
            custom: false
            type: TCP
            enabled: true
          startup:
            spec:
              initialDelaySeconds: 0
              failureThreshold: 30
              timeoutSeconds: 1
              periodSeconds: 5
            custom: false
            type: TCP
            enabled: true
        resources:
          requests:
            cpu: 5m
        image:
          repository: nodered/node-red
          tag: 5.0.7
          pullPolicy: IfNotPresent
    enabled: true
route:
  main:
    rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
      - weight: 1
        group: ""
        identifier: main
        port: 1880
        kind: Service
    kind: HTTPRoute
    parentRefs:
    - kind: Gateway
      name: main
      group: gateway.networking.k8s.io
      namespace: envoy-gateway-system
    hostnames:
    - nodered.mattgerega.net
    enabled: true

