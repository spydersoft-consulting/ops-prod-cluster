persistence:
  data:
    accessMode: ReadWriteMany
    enabled: true
    size: 2Gi
    storageClass: nfs-client
    type: persistentVolumeClaim
route:
  main:
    parentRefs:
    - namespace: envoy-gateway-system
      name: main
      kind: Gateway
      group: gateway.networking.k8s.io
    enabled: true
    rules:
    - matches:
      - path:
          value: /
          type: PathPrefix
      backendRefs:
      - weight: 1
        port: 1880
        group: ""
        identifier: main
        kind: Service
    kind: HTTPRoute
    hostnames:
    - nodered.mattgerega.net
service:
  main:
    primary: true
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 1880
        enabled: true
        primary: true
controllers:
  main:
    containers:
      main:
        env:
          NODE_OPTIONS: 
          NODE_RED_ENABLE_PROJECTS: 
          FLOWS: flows.json
          TZ: America/New_York
          NODE_RED_ENABLE_SAFE_MODE: 
        strategy:
          type: Recreate
        resources:
          requests:
            cpu: 5m
        image:
          tag: 5.0.6
          repository: nodered/node-red
          pullPolicy: IfNotPresent
        probes:
          startup:
            custom: false
            spec:
              failureThreshold: 30
              initialDelaySeconds: 0
              periodSeconds: 5
              timeoutSeconds: 1
            enabled: true
            type: TCP
          liveness:
            custom: false
            spec:
              failureThreshold: 3
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
            enabled: true
            type: TCP
          readiness:
            custom: false
            spec:
              failureThreshold: 3
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
            enabled: true
            type: TCP
    enabled: true
    replicas: 1
    revisionHistoryLimit: 3
    strategy: Recreate
    type: deployment

