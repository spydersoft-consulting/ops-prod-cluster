route:
  main:
    enabled: true
    kind: HTTPRoute
    hostnames:
    - nodered.mattgerega.net
    rules:
    - backendRefs:
      - group: ""
        kind: Service
        weight: 1
        identifier: main
        port: 1880
      matches:
      - path:
          value: /
          type: PathPrefix
    parentRefs:
    - name: main
      kind: Gateway
      namespace: envoy-gateway-system
      group: gateway.networking.k8s.io
service:
  main:
    ports:
      http:
        port: 1880
        enabled: true
        primary: true
    controller: main
    type: ClusterIP
    primary: true
persistence:
  data:
    type: persistentVolumeClaim
    accessMode: ReadWriteMany
    storageClass: nfs-client
    size: 2Gi
    enabled: true
controllers:
  main:
    strategy: Recreate
    replicas: 1
    containers:
      main:
        strategy:
          type: Recreate
        resources:
          requests:
            cpu: 5m
        probes:
          readiness:
            custom: false
            type: TCP
            enabled: true
            spec:
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
              initialDelaySeconds: 0
          liveness:
            custom: false
            type: TCP
            enabled: true
            spec:
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
              initialDelaySeconds: 0
          startup:
            custom: false
            type: TCP
            enabled: true
            spec:
              periodSeconds: 5
              timeoutSeconds: 1
              failureThreshold: 30
              initialDelaySeconds: 0
        image:
          repository: nodered/node-red
          tag: 5.0.4
          pullPolicy: IfNotPresent
        env:
          TZ: America/New_York
          NODE_RED_ENABLE_PROJECTS: 
          NODE_OPTIONS: 
          FLOWS: flows.json
          NODE_RED_ENABLE_SAFE_MODE: 
    type: deployment
    enabled: true
    revisionHistoryLimit: 3

