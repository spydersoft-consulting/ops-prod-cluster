controllers:
  main:
    type: deployment
    revisionHistoryLimit: 3
    replicas: 1
    containers:
      main:
        probes:
          liveness:
            spec:
              initialDelaySeconds: 0
              timeoutSeconds: 1
              failureThreshold: 3
              periodSeconds: 10
            type: TCP
            custom: false
            enabled: true
          startup:
            spec:
              initialDelaySeconds: 0
              timeoutSeconds: 1
              failureThreshold: 30
              periodSeconds: 5
            type: TCP
            custom: false
            enabled: true
          readiness:
            spec:
              initialDelaySeconds: 0
              timeoutSeconds: 1
              failureThreshold: 3
              periodSeconds: 10
            type: TCP
            custom: false
            enabled: true
        resources:
          requests:
            cpu: 5m
        image:
          pullPolicy: IfNotPresent
          tag: 5.0.10
          repository: nodered/node-red
        env:
          NODE_RED_ENABLE_PROJECTS: 
          FLOWS: flows.json
          NODE_RED_ENABLE_SAFE_MODE: 
          NODE_OPTIONS: 
          TZ: America/New_York
        strategy:
          type: Recreate
    enabled: true
    strategy: Recreate
service:
  main:
    primary: true
    type: ClusterIP
    ports:
      http:
        primary: true
        port: 1880
        enabled: true
    controller: main
route:
  main:
    parentRefs:
    - kind: Gateway
      namespace: envoy-gateway-system
      group: gateway.networking.k8s.io
      name: main
    kind: HTTPRoute
    hostnames:
    - nodered.mattgerega.net
    enabled: true
    rules:
    - backendRefs:
      - weight: 1
        identifier: main
        kind: Service
        group: ""
        port: 1880
      matches:
      - path:
          type: PathPrefix
          value: /
persistence:
  data:
    type: persistentVolumeClaim
    size: 2Gi
    accessMode: ReadWriteMany
    enabled: true
    storageClass: nfs-client

