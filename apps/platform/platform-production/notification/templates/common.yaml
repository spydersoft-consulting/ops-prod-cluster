# Source: notification/templates/common.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-app-notification-api
  labels:
    app.kubernetes.io/controller: notification-api
    app.kubernetes.io/instance: notification-app
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: notification-app
    app.kubernetes.io/version: 1.0.0
    helm.sh/chart: notification-1.0.0
  namespace: platform-production
spec:
  revisionHistoryLimit: 1
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/controller: notification-api
      app.kubernetes.io/name: notification-app
      app.kubernetes.io/instance: notification-app
  template:
    metadata:
      annotations: 
        checksum/configMaps: 758c2219f317ac7d02a079be58f7db5c6a4271690a069cabee2f10a86513b06b
      labels: 
        app.kubernetes.io/controller: notification-api
        app.kubernetes.io/instance: notification-app
        app.kubernetes.io/name: notification-app
    spec: 
      enableServiceLinks: false
      serviceAccountName: default
      automountServiceAccountToken: true
      hostIPC: false
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      imagePullSecrets: 
        - name: cr-spydersoft-github
      containers: 
        - env:
          - name: Notification__HubInternalUrl
            value: http://notification-app-notification-hub/internal
          envFrom:
          - secretRef:
              name: notification-secrets
          - configMapRef:
              name: notification-app
          image: ghcr.io/spydersoft-consulting/notification-api:1.0.0
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
          name: main
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 5m
